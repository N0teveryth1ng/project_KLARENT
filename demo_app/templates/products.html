{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<form method="get" action="/demo/products">
    <input type="text" name="search" placeholder="Search products..." value="{{ search or '' }}">
    <button type="submit">Search</button>
</form>
{% for product in products %}
<div class="product">
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>
    <p><strong>${{ product.price }}</strong></p>
    <a href="/demo/products/{{ product.id }}"><button>View Details</button></a>
    <form method="post" action="/demo/cart/add" style="display:inline;">
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <input type="number" name="quantity" value="1" min="1" style="width:60px;">
        <button type="submit">Add to Cart</button>
    </form>
</div>
{% endfor %}
{% endblock %}
