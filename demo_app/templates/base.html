<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Shop - Agent Reliability Lab</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        nav { background: #333; color: white; padding: 10px 20px; margin: -20px -20px 20px -20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; }
        .product { border: 1px solid #ddd; padding: 15px; margin: 10px 0; }
        button { background: #007bff; color: white; padding: 8px 15px; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        input, form { margin: 5px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="/demo/products">Products</a>
        <a href="/demo/cart">Cart</a>
        <a href="/demo/orders">Orders</a>
        <a href="/demo/login">Login</a>
        <a href="/demo/register">Register</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
