[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Agent QA Reliability & Recovery Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "playwright>=1.48.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "demo_app"]
