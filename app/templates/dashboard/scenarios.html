{% extends "dashboard/base.html" %}
{% block content %}
<h1>Scenarios</h1>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody>
            {% for scenario in scenarios %}
            <tr>
                <td>{{ scenario.name }}</td>
                <td>{{ scenario.description }}</td>
                <td>{{ scenario.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
