{% extends "dashboard/base.html" %}
{% block content %}
<h1>Run Details</h1>
<div class="card">
    <p><strong>Run ID:</strong> {{ run.id }}</p>
    <p><strong>Status:</strong> <span class="status status-{{ run.status.lower() }}">{{ run.status }}</span></p>
    <p><strong>Started:</strong> {{ run.started_at }}</p>
    <p><strong>Completed:</strong> {{ run.completed_at }}</p>
</div>
{% endblock %}
