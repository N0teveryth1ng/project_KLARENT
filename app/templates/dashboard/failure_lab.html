{% extends "dashboard/base.html" %}
{% block content %}
<h1>Failure Laboratory</h1>
<div class="card">
    <h2>Inject Failures for Testing</h2>
    <p>Deliberately inject failures and observe recovery behavior.</p>
    <table>
        <thead>
            <tr>
                <th>Scenario</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for scenario in scenarios %}
            <tr>
                <td>{{ scenario.name }}</td>
                <td><button>Run with Failure Injection</button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
